# SmartCity360 database settings.
# The application first tries MySQL. If it cannot connect, it falls back to an in-memory
# database (H2) so the demo still works - the website shows a warning banner when that happens.
# Any value can be overridden with an environment variable: DB_URL, DB_USER, DB_PASSWORD.
db.url=jdbc:mysql://localhost:3306/smartcity360?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

